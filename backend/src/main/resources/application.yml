server:
  port: 8080

spring:
  application:
    name: deployx-api
  datasource:
    url: ${DEPLOYX_DB_URL:jdbc:postgresql://localhost:5432/deployx}
    username: ${DEPLOYX_DB_USER:deployx}
    password: ${DEPLOYX_DB_PASSWORD:deployx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${DEPLOYX_RABBITMQ_HOST:localhost}
    port: ${DEPLOYX_RABBITMQ_PORT:5672}
    username: ${DEPLOYX_RABBITMQ_USER:guest}
    password: ${DEPLOYX_RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${DEPLOYX_REDIS_HOST:localhost}
      port: ${DEPLOYX_REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

deployx:
  queue:
    type: ${DEPLOYX_QUEUE_TYPE:in-process}
    exchange: ${DEPLOYX_QUEUE_EXCHANGE:deployx}
    queue: ${DEPLOYX_QUEUE_NAME:deployments}
  coordination:
    enabled: ${DEPLOYX_REDIS_ENABLED:false}
    lock-seconds: ${DEPLOYX_REDIS_LOCK_SECONDS:900}
  jwt:
    secret: ${DEPLOYX_JWT_SECRET:local-dev-only-change-me-to-a-256-bit-secret-key!!}
    expiration-ms: 86400000
  worker:
    mode: ${DEPLOYX_WORKER_MODE:simulate}
    workspace: ${DEPLOYX_WORKER_WORKSPACE:${java.io.tmpdir}/deployx-workspace}
    base-url: ${DEPLOYX_PUBLIC_BASE_URL:http://localhost}
    health-path: ${DEPLOYX_WORKER_HEALTH_PATH:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
